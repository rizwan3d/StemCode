[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stemcode-sdk"
version = "0.1.0"
description = "Python wrapper for the StemCode .NET SDK using pythonnet."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pythonnet>=3.0.5",
]
license = { text = "Apache-2.0" }
authors = [
    { name = "Rizwan3d" },
]
keywords = ["stemcode", "ai", "agent", "pythonnet", "dotnet"]

[project.urls]
Repository = "https://github.com/rizwan3d/StemCode"
Documentation = "https://github.com/rizwan3d/StemCode/blob/master/docs/documentation.md"

[tool.hatch.build.targets.wheel]
packages = ["stemcode"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
